<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ note.title }} - Sticky Notes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Notes</a>
        
        <div class="note-detail" style="background-color: #yellow;">
            <h1>{{ note.title }}</h1>
            <p>{{ note.content }}</p>
            
            <div class="actions">
                <form method="POST" action="/notes/{{ note.id }}" style="display: inline;">
                    <input type="text" name="title" value="{{ note.title }}" required style="display: none;">
                    <textarea name="content" style="display: none;">{{ note.content }}</textarea>
                    <button type="submit" class="btn">Update</button>
                </form>
                <button onclick="deleteNote({{ note.id }})" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script>
        function deleteNote(noteId) {
            if (confirm('Delete this note?')) {
                fetch(`/notes/${noteId}`, { method: 'DELETE' })
                    .then(() => window.location.href = '/')
                    .catch(err => console.error('Error:', err));
            }
        }
    </script>
</body>
</html>
